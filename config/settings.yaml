# =============================================================================
#  XAU Quant Scalper - main configuration
#  All times are BROKER SERVER TIME unless stated otherwise (MT5 bar timestamps
#  are in server time). Prices in points = symbol "point" (XAUUSD: 0.01).
# =============================================================================

general:
  magic_number: 20261110
  comment_prefix: "XQS"
  poll_interval_ms: 250          # main loop cadence (tick polling)
  log_level: INFO
  log_dir: logs

mt5:
  timeout_ms: 10000
  max_reconnect_attempts: 5
  reconnect_backoff_s: 2.0       # exponential: 2, 4, 8, ...

# -----------------------------------------------------------------------------
# Instruments. Each symbol can override strategy/guardrail parameters.
# `spec` is used ONLY by the backtester (live reads it from the broker).
# -----------------------------------------------------------------------------
symbols:
  XAUUSD:
    enabled: true
    max_spread_points: 35        # hard cap
    spread_median_mult: 1.8      # dynamic: spread <= median(window) * mult
    spread_atr_ratio_max: 0.15   # spread must be <= 15% of M1 ATR
    stop_hunt_round_step: 0.50   # avoid placing SL near .00/.50 levels
    stop_hunt_buffer_points: 15
    spec: {point: 0.01, digits: 2, tick_size: 0.01, tick_value: 1.0, contract_size: 100,
           volume_min: 0.01, volume_max: 50.0, volume_step: 0.01, stops_level: 0}
  US100:
    enabled: false
    max_spread_points: 250
    spread_median_mult: 2.0
    spread_atr_ratio_max: 0.20
    stop_hunt_round_step: 25.0
    stop_hunt_buffer_points: 300
    spec: {point: 0.01, digits: 2, tick_size: 0.01, tick_value: 0.01, contract_size: 1,
           volume_min: 0.1, volume_max: 100.0, volume_step: 0.1, stops_level: 0}
  EURUSD:
    enabled: false
    max_spread_points: 15
    spread_median_mult: 2.0
    spread_atr_ratio_max: 0.25
    stop_hunt_round_step: 0.0010
    stop_hunt_buffer_points: 20
    spec: {point: 0.00001, digits: 5, tick_size: 0.00001, tick_value: 1.0, contract_size: 100000,
           volume_min: 0.01, volume_max: 50.0, volume_step: 0.01, stops_level: 0}
  AUDCAD:
    enabled: false
    max_spread_points: 25
    spread_median_mult: 2.0
    spread_atr_ratio_max: 0.30
    stop_hunt_round_step: 0.0010
    stop_hunt_buffer_points: 20
    spec: {point: 0.00001, digits: 5, tick_size: 0.00001, tick_value: 0.73, contract_size: 100000,
           volume_min: 0.01, volume_max: 50.0, volume_step: 0.01, stops_level: 0}

# -----------------------------------------------------------------------------
# Strategy: XAU Velocity Scalp (M1 trigger / M5 confirmation / M15 bias)
# -----------------------------------------------------------------------------
strategy:
  name: xau_velocity_scalp
  timeframes: {entry: M1, confirm: M5, trend: M15}
  history_bars: 400              # bars pulled per timeframe
  trend_ema: 50                  # M15 bias EMA
  trend_slope_bars: 3            # EMA slope measured over N M15 bars
  confirm_ema_fast: 9            # M5 confirmation
  confirm_ema_slow: 21
  atr_period: 14
  velocity_lookback: 3           # M1 bars of the momentum burst
  velocity_atr_mult: 1.2         # |close - close[-N]| >= k * ATR(M1)
  body_ratio_min: 0.55           # trigger candle body / range
  close_location_min: 0.70       # close in the top/bottom 30% of the range
  volume_ma_period: 20
  volume_spike_mult: 1.4         # tick-volume burst confirmation
  rsi_period: 7
  rsi_long_max: 80               # do not buy exhausted moves
  rsi_short_min: 20
  max_bar_atr_mult: 3.0          # trigger bar range > 3 ATR = gap/news spike -> skip
  entry_mode: limit              # market | limit (pullback into the burst)
  limit_pullback_atr: 0.25
  limit_expiry_s: 90
  sl_atr_mult: 1.3               # SL = max(swing extreme, k*ATR) beyond entry
  sl_min_points: 80
  sl_max_points: 600
  tp_r_multiple: 1.6
  max_hold_minutes: 25           # time-stop: scalps that do not move get cut

# -----------------------------------------------------------------------------
# Risk & money management
# -----------------------------------------------------------------------------
risk:
  risk_per_trade_pct: 0.50       # % of equity at SL distance
  commission_per_lot: 7.0        # round-turn, account currency (used in sizing)
  max_lot: 5.0
  max_open_positions: 2          # global
  max_positions_per_symbol: 1
  max_margin_usage_pct: 30.0
  daily_loss_limit_pct: 3.0      # kill-switch on (realized + floating) vs day-start equity
  daily_trailing_dd_pct: 4.0     # kill-switch on drawdown from intraday equity peak
  daily_profit_lock_pct: 0.0     # 0 = disabled. Stop trading after +X% on the day
  max_consecutive_losses: 4
  max_trades_per_day: 30
  cooldown_after_loss_s: 120

# -----------------------------------------------------------------------------
# Guardrails (anti-gap / anti-slippage / anti-spread-spike)
# -----------------------------------------------------------------------------
guardrails:
  spread_window: 300             # ticks kept for rolling median
  spread_min_samples: 30
  gap_atr_mult: 1.5              # |open - prev close| > k*ATR => gap
  gap_cooldown_bars: 3
  tick_jump_atr_mult: 1.0        # tick-to-tick jump > k*ATR => liquidity hole
  tick_jump_cooldown_s: 30
  stale_tick_s: 10               # no tick for N s => feed stale, no new entries
  slippage_window: 10
  max_avg_slippage_points: 25
  slippage_pause_s: 600
  max_deviation_points: 20       # MT5 request "deviation"

sessions:
  # [start, end) server time. Empty list = trade 24h.
  windows:
    - ["09:00", "12:30"]         # London
    - ["14:30", "18:30"]         # NY open + overlap
  rollover_blackout: ["23:50", "01:10"]
  friday_cutoff: "21:00"
  monday_start: "01:30"
  news_blackouts: []             # e.g. ["2026-11-06 15:25", "2026-11-06 15:50"] pairs
  news_blackout_minutes_before: 5
  news_blackout_minutes_after: 10

# -----------------------------------------------------------------------------
# Trade management
# -----------------------------------------------------------------------------
execution:
  partial_close_r: 1.0           # at +1R ...
  partial_close_fraction: 0.5    # ... close 50%
  break_even_r: 1.0              # move SL to BE at +1R
  break_even_buffer_points: 10   # lock spread + a few points
  trailing_start_r: 1.2
  trailing_atr_mult: 1.0
  order_retries: 3
  retry_delay_ms: 150

backtest:
  initial_equity: 10000.0
  default_spread_points: 20      # used when CSV has no spread column
  spread_jitter_points: 8        # random extra spread per bar
  slippage_points: 5             # adverse slippage on market fills / stops
  seed: 42
  equity_curve_file: logs/equity_curve.csv
  trades_file: logs/backtest_trades.csv

dashboard:
  refresh_per_second: 4
  max_events: 14
